name: Update IDX Data

on:
  schedule:
    # Tiap 15 menit, jam 08:30-16:30 WIB (= 01:30-09:30 UTC), Senin-Jumat
    - cron: "*/15 1-9 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Ticker custom (pisah spasi), kosongin buat pakai portofolio default"
        required: false
        default: ""

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            python fetch_idx.py ${{ github.event.inputs.tickers }}
          else
            python fetch_idx.py AHAP ARCI ASII BBCA BFIN BREN BUMI BUVA CITA CNKO COAL CUAN DEWA DKFT EMAS EMTK GOLF GOTO GTSI HADE IMPC KIJA KIOS MGLV PBSA PRDL PTRO RAJA RATU SIMP SSIA TOBA WBSA
          fi

      - name: Commit hasil
        run: |
          git config user.name "idx-bot"
          git config user.email "actions@users.noreply.github.com"
          git add idx_data.json
          git diff --quiet --cached || git commit -m "Update IDX data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
