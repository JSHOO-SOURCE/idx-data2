name: Update IDX Data2

on:
  schedule:
    # Tiap 15 menit, jam 08:30-16:30 WIB (= 01:30-09:30 UTC), Senin-Jumat
    - cron: "*/15 1-9 * * 1-5"
  workflow_dispatch: {}  # biar bisa dipicu manual dari tab Actions kalau perlu

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data
        run: python fetch_idx.py APLN ISAT CTRA DMAS BSDE BFIN ASII
        # ^ ganti/tambah daftar ticker sesuai yang mau lu pantau

      - name: Commit hasil
        run: |
          git config user.name "idx-bot"
          git config user.email "actions@users.noreply.github.com"
          git add idx_data.json
          git diff --quiet --cached || git commit -m "Update IDX data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
